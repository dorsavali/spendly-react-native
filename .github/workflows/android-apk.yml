name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate project before build
        run: |
          npx tsc --noEmit
          npx expo-doctor@1.20.2

      - name: Build Android release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spendly-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare tagged release asset
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/spendly-${GITHUB_REF_NAME}.apk"

      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "release/spendly-${GITHUB_REF_NAME}.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "release/spendly-${GITHUB_REF_NAME}.apk" --generate-notes --title "Spendly $GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          fi
